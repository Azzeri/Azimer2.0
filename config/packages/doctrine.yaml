doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            vehicle_plate_number: App\Fleet\Infrastructure\Repository\Persistence\Doctrine\Type\Identifier\VehiclePlateNumberType
            tenant_email: App\Security\Infrastructure\Tenant\Repository\Persistence\Doctrine\Type\Identifier\TenantEmailType
            role_unique_name: App\Security\Infrastructure\Role\Repository\Persistence\Doctrine\Type\Identifier\RoleUniqueNameType
            resource_unique_name: App\Security\Infrastructure\Resource\Repository\Persistence\Doctrine\Type\Identifier\ResourceUniqueNameType
            fire_brigade_unit_id: App\FireBrigadeUnit\Infrastructure\Repository\Persistence\Doctrine\Type\Identifier\FireBrigadeUnitIdType
            employee_id: App\Employee\Infrastructure\Repository\Persistence\Doctrine\Type\Identifier\EmployeeIdType
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/App'
                prefix: 'App\Entity'
                alias: App
            Fleet:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/App/Fleet/Domain'
                prefix: 'App\Fleet\Domain'
                alias: App\Fleet\Domain
            Security:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/App/Security/Domain/'
                prefix: 'App\Security\Domain'
                alias: App\Security\Domain
            FireBrigadeUnit:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/App/FireBrigadeUnit/Domain/'
                prefix: 'App\FireBrigadeUnit\Domain'
                alias: App\FireBrigadeUnit\Domain
            Employee:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/App/Employee/Domain/'
                prefix: 'App\Employee\Domain'
                alias: App\Employee\Domain
when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
